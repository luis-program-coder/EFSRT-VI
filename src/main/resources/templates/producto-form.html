
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Producto | TechNova</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/css/style.css">

    <script defer src="/js/app.js"></script>
</head>

<body>

    <header>
        <div class="wrap nav">

            <a class="logo" href="/">
                Tech<span>Nova</span>
            </a>

            <nav>
                <a href="/">Inicio</a>
                <a href="/catalogo">Catálogo</a>
                <a href="/contacto">Contáctanos</a>
                <a href="/ubicacion">Ubícanos</a>
                <a href="/admin/productos">Administración</a>
                <a href="/carrito">🛒 Carrito</a>
            </nav>

        </div>
    </header>

    <main class="wrap sec narrow">

        <h1 th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">
        </h1>
		
		</a>

        <form class="form"
              action="/admin/productos/guardar"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden"
                   name="id"
                   th:value="${producto.id}">

            <label class="wide">
                Nombre

                <input name="nombre"
                       th:value="${producto.nombre}"
                       required>
            </label>

            <label class="wide">
                Descripción

                <textarea name="descripcion"
                          th:text="${producto.descripcion}">
                </textarea>
            </label>

            <label>
                Precio

                <input type="number"
                       step="0.01"
                       name="precio"
                       th:value="${producto.precio}"
                       required>
            </label>

            <label>
                Precio oferta

                <input type="number"
                       step="0.01"
                       name="precioOferta"
                       th:value="${producto.precioOferta}">
            </label>

            <label>
                Stock

                <input type="number"
                       name="stock"
                       th:value="${producto.stock}">
            </label>

            <label>
                Stock mínimo

                <input type="number"
                       name="stockMinimo"
                       th:value="${producto.stockMinimo}">
            </label>

            <label>
                Código

                <input name="codigo"
                       th:value="${producto.codigo}"
                       placeholder="Ej. LAP-001">
            </label>

            <input type="hidden"
                   name="estado"
                   th:value="${producto.estado}">

            <label>
                Imagen URL

                <input name="imagen"
                       th:value="${producto.imagen}">
            </label>

            <label>
                Categoría

                <select name="categoriaId">

                    <option th:each="c : ${categorias}"
                            th:value="${c.id}"
                            th:text="${c.nombre}"
                            th:selected="${producto.categoria != null && producto.categoria.id == c.id}">
                    </option>

                </select>

            </label>

            <label>
                Marca

                <select name="marcaId">

                    <option th:each="m : ${marcas}"
                            th:value="${m.id}"
                            th:text="${m.nombre}"
                            th:selected="${producto.marca != null && producto.marca.id == m.id}">
                    </option>

                </select>

            </label>

            <button class="btn wide">
                💾 Guardar producto
            </button>
            <a class="btn secondary wide"
               href="/admin/productos">
                ↩ Volver a productos
            </a>

        </form>

    </main>

</body>

</html>
