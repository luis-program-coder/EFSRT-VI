
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Dashboard | TechNova
    </title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>


    <!-- Encabezado -->

    <header>

        <div class="wrap nav">


            <a class="logo"
               href="/">

                Tech<span>Nova</span>

            </a>


            <nav>

                <a href="/">
                    Inicio
                </a>

                <a href="/catalogo">
                    Catálogo
                </a>

                <a href="/admin/productos">
                    Productos
                </a>

                <a href="/admin/pedidos">
                    Ventas
                </a>

                <a href="/carrito">
                    🛒 Carrito
                </a>

            </nav>


        </div>

    </header>


    <!-- Contenido principal -->

    <main class="wrap sec">


        <!-- Título y cerrar sesión -->

        <div class="title">


            <div>

                <small>
                    PANEL DE CONTROL
                </small>

                <h1>
                    Administración TechNova
                </h1>

            </div>


            <form
                method="post"
                action="/logout"
                style="display: block">


                <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">


                <button class="btn secondary">

                    Cerrar sesión

                </button>


            </form>


        </div>


        <!-- Tarjetas del Dashboard -->

        <div class="grid">


            <!-- Catálogo -->

            <div class="card">

                <div>

                    <small>
                        CATÁLOGO ACTIVO
                    </small>


                    <h2
                        th:text="${productos}">
                    </h2>


                    <a
                        class="btn"
                        href="/admin/productos">

                        Gestionar productos

                    </a>

                </div>

            </div>


            <!-- Pedidos -->

            <div class="card">

                <div>

                    <small>
                        PEDIDOS
                    </small>


                    <h2
                        th:text="${pedidos}">
                    </h2>


                    <a
                        class="btn"
                        href="/admin/pedidos">

                        Ver ventas

                    </a>

                </div>

            </div>


            <!-- Stock bajo -->

            <div class="card">

                <div>

                    <small>
                        STOCK BAJO
                    </small>


                    <h2
                        th:text="${stockBajo}">
                    </h2>


                    <a
                        class="btn"
                        href="/admin/productos">

                        Revisar stock

                    </a>

                </div>

            </div>


            <!-- Reportes -->

            <div class="card">

                <div>

                    <small>
                        REPORTES
                    </small>


                    <h2>
                        📊
                    </h2>


                    <a
                        class="btn"
                        href="/api/admin/reportes/ventas.pdf">

                        PDF

                    </a>


                    <a
                        class="btn secondary"
                        href="/api/admin/reportes/productos.xlsx">

                        Excel

                    </a>

                </div>

            </div>


        </div>


    </main>


</body>

</html>
