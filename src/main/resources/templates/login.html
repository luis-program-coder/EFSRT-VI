<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Login - TechNova
    </title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>


    <main class="container">


        <h1>
            TechNova
        </h1>


        <h2>
            Acceso al sistema
        </h2>


        <form
            method="post"
            action="/login">


            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <input
                name="username"
                placeholder="Usuario"
                required>


            <input
                name="password"
                type="password"
                placeholder="Contraseña"
                required>


            <button>
                Ingresar
            </button>


        </form>


        <!-- Mensaje de error -->

        <p
            th:if="${param.error}"
            style="color:#b91c1c; font-weight:700">

            Usuario o contraseña incorrectos.

        </p>


        <!-- Mensaje de cierre de sesión -->

        <p
            th:if="${param.logout}"
            style="color:#15803d; font-weight:700">

            Sesión cerrada correctamente.

        </p>


        <!-- Usuario de demostración -->

        <p>

            <b>
                
            </b>

            

            &nbsp;

            <b>
                
            </b>

            

        </p>


    </main>


</body>

</html>
