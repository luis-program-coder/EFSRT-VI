
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Administración | TechNova</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="/css/style.css">

    <script defer
            src="/js/app.js">
    </script>

</head>

<body>

    <header>

        <div class="wrap nav">

            <a class="logo"
               href="/">
                Tech<span>Nova</span>
            </a>

            <nav>

                <a href="/">
                    Inicio
                </a>

                <a href="/catalogo">
                    Catálogo
                </a>

                <a href="/contacto">
                    Contáctanos
                </a>

                <a href="/ubicacion">
                    Ubícanos
                </a>

                <a href="/admin/productos">
                    Administración
                </a>

                <a href="/carrito">
                    🛒 Carrito
                </a>

            </nav>

        </div>

    </header>


    <main class="wrap sec">

        <div class="title">

            <div>

                <small>
                    ADMINISTRACIÓN
                </small>

                <h1>
                    CRUD de productos
                </h1>

            </div>


            <a class="btn"
               href="/admin/productos/nuevo">
                + Nuevo producto
            </a>

        </div>


        <div class="tabs">

            <a class="active"
               href="/admin/productos">
                Productos
            </a>

            <a href="/admin/pedidos">
                Ventas / Pedidos
            </a>

        </div>


        <div class="tablewrap">

            <table>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Producto
                    </th>

                    <th>
                        Marca
                    </th>

                    <th>
                        Precio
                    </th>

                    <th>
                        Oferta
                    </th>

                    <th>
                        Stock
                    </th>

                    <th>
                        Estado
                    </th>

                    <th>
                        Imagen
                    </th>

                    <th>
                        Acciones
                    </th>

                </tr>


                <tr th:each="p : ${productos}">

                    <td th:text="${p.id}">
                    </td>

                    <td th:text="${p.nombre}">
                    </td>

                    <td th:text="${p.marca != null ? p.marca.nombre : '-'}">
                    </td>

                    <td th:text="'S/ ' + ${p.precio}">
                    </td>

                    <td th:text="${p.precioOferta != null ? 'S/ ' + p.precioOferta : '-'}">
                    </td>

                    <td th:text="${p.stock}">
                    </td>


                    <td>

                        <span
                            th:class="${p.estado ? 'status-ok' : 'status-off'}"
                            th:text="${p.estado ? 'DISPONIBLE' : 'AGOTADO'}">
                        </span>

                    </td>


                    <td>

                        <img
                            class="admin-thumb"
                            th:src="${p.imagen}"
                            th:alt="${p.nombre}"
                            onerror="this.onerror=null;this.src='/img/producto-placeholder.svg';"
                            alt="Producto">

                    </td>


                    <td>

                        <a
                            class="btn secondary"
                            th:href="@{'/admin/productos/editar/' + ${p.id}}">
                            ✏️ Editar
                        </a>


                        <a
                            class="btn"
                            style="background:#fee2e2;color:#991b1b"
                            onclick="return confirm('¿Desactivar este producto?')"
                            th:href="@{'/admin/productos/eliminar/' + ${p.id}}">
                            🗑️ Desactivar
                        </a>

                    </td>

                </tr>

            </table>

        </div>

    </main>

</body>

</html>
